<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Nastavenia</title>
        <link rel="stylesheet" href="popup.css">
    </head>

    <body>
        <h3 id="title">Nastavenia</h3>
        
        <div class="option">
            <label for="intervalSelect">Interval:</label>
            <select id="intervalSelect">
                <option value="instant">Instantný (!!EXPERIMENTÁLNE!!, 1ms/vyriešenie)</option>
                <option value="ultrasonic">Ultrasonický (50ms/vyriešenie)</option>
                <option value="sonic">Sonický (100ms/vyriešenie)</option>
                <option value="vquick">Svižný (250ms/vyriešenie)</option>
                <option value="quick" selected>Rýchly (500ms/vyriešenie)</option>
                <option value="normal">Normálny (1000ms/vyriešenie)</option>
                <option value="slow">Pomalý (2000ms/vyriešenie)</option>
            </select>
        <div class="solving">
            <button id="solveButton" class="solvebtn">Riešiť</button>
            <label for="solveButton">Spustiť riešenie</label>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
